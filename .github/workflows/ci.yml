name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stringcost_test
          POSTGRES_USER: stringcost
          POSTGRES_PASSWORD: stringcost
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stringcost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: true
      DATABASE_URL: postgresql://stringcost:stringcost@127.0.0.1:5432/stringcost_test
      TEST_DATABASE_URL: postgresql://stringcost:stringcost@127.0.0.1:5432/stringcost_test
      TEST_REDIS_URL: redis://127.0.0.1:6379
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
      TESTCONTAINERS_RYUK_DISABLED: true
      DISABLE_RATE_LIMITING: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run database migrations
        run: npm run db:migrate

      - name: Seed database
        run: npm run db:seed

      - name: Run tests
        env:
          ENABLE_SUPERTEST: "true"
        run: npm run test
