domain: "test.local"

ingress:
  enabled: true
  className: "gce"
  staticIpName: "honojs-apis-ip"

services:
  - name: gateway
    image: jitendrapalei/gateway-service:latest
    replicas: 2
    containerPort: 8787
    ingressPath: /llm
    healthPath: /healthz
    readinessPath: /readyz
    env:
      - name: PORT
        value: "8787"
      - name: CONTROL_PLANE_URL
        value: "http://control-plane:8080/control"
      - name: URL_TOKEN_KEYS
        valueFrom:
          secretKeyRef:
            name: stringcost-config
            key: url_token_keys
      - name: SIGNED_URL_DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: stringcost-config
            key: database_url
      - name: DISABLE_RATE_LIMITING
        value: "false"
  - name: control-plane
    image: jitendrapalei/control-plane-service:v2
    replicas: 1
    containerPort: 8080
    ingressPath: /v1
    healthPath: /healthz
    readinessPath: /readyz
    env:
      - name: PORT
        value: "8080"
      - name: DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: stringcost-config
            key: database_url
      - name: DATABASE_ENCRYPTION_KEY
        valueFrom:
          secretKeyRef:
            name: stringcost-config
            key: database_encryption_key
      - name: URL_TOKEN_KEYS
        valueFrom:
          secretKeyRef:
            name: stringcost-config
            key: url_token_keys
      - name: GATEWAY_BASE_URL
        value: "https://$(domain)"
      - name: DISABLE_RATE_LIMITING
        value: "false"
  - name: event-collector
    image: jitendrapalei/event-collector-service:latest
    replicas: 1
    containerPort: 8080
    ingressPath: /events
    healthPath: /healthz
    readinessPath: /readyz
    env:
      - name: PORT
        value: "8080"
      - name: DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: stringcost-config
            key: database_url
      - name: DISABLE_RATE_LIMITING
        value: "false"
  - name: worker
    image: jitendrapalei/worker-service:latest
    replicas: 1
    containerPort: 8080
    healthPath: /healthz
    env:
      - name: PORT
        value: "8080"
      - name: DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: stringcost-config
            key: database_url
      - name: META_LLM_CLASSIFIER_ENDPOINT
        valueFrom:
          secretKeyRef:
            name: stringcost-config
            key: classifier_endpoint
      - name: META_LLM_API_KEY
        valueFrom:
          secretKeyRef:
            name: stringcost-config
            key: classifier_api_key


# Global Helm settings
imageTag: latest
imagePullPolicy: IfNotPresent
secretName: stringcost-config

# Run database migrations as a pre-install/pre-upgrade Kubernetes Job
# This ensures classification_jobs and other tables exist before services start
runMigrations: true
